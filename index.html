<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar & Security</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>



  <section class="form-section">
    <div class="form-container">
      
      <form id="contactForm">
        <h2>Request Assessment</h2>
        <div class="input-group">
          <input type="text" placeholder="Your Name" required>
        </div>
        <div class="input-group">
          <input type="email" placeholder="Email Address" required>
        </div>
        <div class="input-group">
          <textarea rows="4" placeholder="Describe your solar or security requirements..." required></textarea>
        </div>
        <button type="submit" class="submit-btn">Submit Request</button>
      </form>

      <div id="successMessage" class="success-box">
        <h3>Request Logged Successfully</h3>
        <p>We will contact you once a technician has assessed your requirements.</p>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
